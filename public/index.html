<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayPal Payments Agent</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#111}
  h1{font-size:22px}
  textarea{width:100%;height:80px;padding:10px;font-size:16px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}
  button{padding:10px 16px;font-size:15px;border:0;border-radius:8px;cursor:pointer;background:#0070ba;color:#fff;margin-top:8px}
  button.secondary{background:#e5e7eb;color:#111;margin-left:8px}
  .card{border:1px solid #ddd;border-radius:10px;padding:14px;margin-top:16px}
  .row{padding:6px 0;border-bottom:1px solid #eee}
  .msg{margin-top:16px;padding:12px;border-radius:8px;background:#f3f4f6}
  .err{background:#fee2e2}
  .ok{background:#dcfce7}
</style>
</head>
<body>
<h1>PayPal Payments Agent (Sandbox)</h1>
<textarea id="cmd" placeholder="e.g. Pay Meera $50 and Arjun $75, or Invoice Ravi $200 for logo design, due Friday"></textarea>
<button id="go">Send</button>
<div id="out"></div>

<script>
const out = document.getElementById("out");
const cmd = document.getElementById("cmd");
let pending = null;

function show(cls, text) {
  out.innerHTML = "";
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  out.appendChild(d);
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

document.getElementById("go").onclick = async () => {
  const text = cmd.value.trim();
  if (!text) return;
  show("", "Thinking...");
  try {
    const data = await post("/parse", { text });
    if (data.unclear || !data.actions || !data.actions.length) {
      return show("", data.unclear || "I didn't understand that.");
    }
    pending = data.actions;
    renderCard();
  } catch (e) { show("err", e.message); }
};

function renderCard() {
  out.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("strong");
  h.textContent = "Please confirm:";
  card.appendChild(h);
  pending.forEach((a) => {
    const row = document.createElement("div");
    row.className = "row";
    row.textContent = a.type === "invoice"
      ? `Invoice ${a.contact} $${a.amount} for "${a.description}", due ${a.dueDate}`
      : `Pay ${a.contact} $${a.amount} (${a.description})`;
    card.appendChild(row);
  });
  const ok = document.createElement("button");
  ok.textContent = "Confirm";
  ok.onclick = confirmRun;
  const no = document.createElement("button");
  no.textContent = "Cancel";
  no.className = "secondary";
  no.onclick = () => { pending = null; out.innerHTML = ""; };
  card.appendChild(ok);
  card.appendChild(no);
  out.appendChild(card);
}

async function confirmRun() {
  show("", "Sending...");
  try {
    const data = await post("/execute", { actions: pending });
    pending = null;
    show("ok", "Done! " + data.results.join(" | "));
  } catch (e) { show("err", e.message); }
}
</script>
</body>
</html>
